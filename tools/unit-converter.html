<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

</head>
<body>

        IP Subnet Tool

    <div class="sidebar-footer">
      School Infrastructure &copy; 2026

  <!-- Main -->
  <main class="main">
    <div class="tool-page-header">
      <a href="../index.html">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Dashboard
      </a>
    </div>

    <h1 class="tool-page-title" style="margin-bottom:6px">Unit Converter</h1>
    <p style="color:var(--text-2);margin-bottom:28px">Convert between common measurement units.</p>

    <!-- Category Tabs -->
    <div class="tabs" style="margin-bottom:24px">
      <button class="tab-btn active" data-cat="length">Length</button>
      <button class="tab-btn" data-cat="weight">Weight</button>
      <button class="tab-btn" data-cat="temperature">Temperature</button>
      <button class="tab-btn" data-cat="speed">Speed</button>
      <button class="tab-btn" data-cat="area">Area</button>
    </div>

    <div class="tool-card-panel">

      <div class="form-row">
        <div class="form-group">
          <label for="input-value">Value</label>
          <input type="number" id="input-value" placeholder="Enter value" />
        </div>
        <div class="form-group">
          <label for="from-unit">From</label>
          <select id="from-unit"></select>
        </div>
      </div>

      <div class="form-group">
        <label for="to-unit">To</label>
        <select id="to-unit"></select>
      </div>

      <div style="display:flex;gap:10px;margin-top:4px">
        <button class="btn" onclick="convert()">Convert</button>
        <button class="btn btn-ghost" onclick="swapUnits()">&#8645; Swap</button>
        <button class="btn btn-ghost" onclick="resetForm()">Clear</button>
      </div>

      <div class="result-box" id="result-box">
        <div class="result-label">Result</div>
        <div class="result-value" id="result-value"></div>
        <div class="result-formula" id="result-formula"></div>
      </div>
    </div>
  </main>

  <script src="../js/main.js"></script>
  <script>
    // Unit definitions: { label, toBase } — base unit is SI or common anchor
    const UNITS = {
      length: {
        base: 'meter',
        units: {
          meter:      { label: 'Meter (m)',        factor: 1 },
          kilometer:  { label: 'Kilometer (km)',   factor: 1000 },
          centimeter: { label: 'Centimeter (cm)',  factor: 0.01 },
          millimeter: { label: 'Millimeter (mm)',  factor: 0.001 },
          inch:       { label: 'Inch (in)',        factor: 0.0254 },
          foot:       { label: 'Foot (ft)',        factor: 0.3048 },
          yard:       { label: 'Yard (yd)',        factor: 0.9144 },
          mile:       { label: 'Mile (mi)',        factor: 1609.344 },
          nautical:   { label: 'Nautical Mile',   factor: 1852 },
        }
      },
      weight: {
        base: 'kilogram',
        units: {
          kilogram:  { label: 'Kilogram (kg)',   factor: 1 },
          gram:      { label: 'Gram (g)',         factor: 0.001 },
          milligram: { label: 'Milligram (mg)',   factor: 0.000001 },
          tonne:     { label: 'Metric Tonne (t)', factor: 1000 },
          pound:     { label: 'Pound (lb)',       factor: 0.453592 },
          ounce:     { label: 'Ounce (oz)',       factor: 0.0283495 },
        }
      },
      temperature: {
        base: 'celsius',
        units: {
          celsius:    { label: 'Celsius (°C)' },
          fahrenheit: { label: 'Fahrenheit (°F)' },
          kelvin:     { label: 'Kelvin (K)' },
        }
      },
      speed: {
        base: 'ms',
        units: {
          ms:   { label: 'm/s',      factor: 1 },
          kmh:  { label: 'km/h',     factor: 1/3.6 },
          mph:  { label: 'mph',      factor: 0.44704 },
          knot: { label: 'Knot (kn)',factor: 0.514444 },
        }
      },
      area: {
        base: 'sqm',
        units: {
          sqm:   { label: 'Square Meter (m²)',    factor: 1 },
          sqkm:  { label: 'Square Km (km²)',      factor: 1e6 },
          sqcm:  { label: 'Square Cm (cm²)',      factor: 0.0001 },
          sqft:  { label: 'Square Foot (ft²)',    factor: 0.092903 },
          sqin:  { label: 'Square Inch (in²)',    factor: 0.00064516 },
          acre:  { label: 'Acre',                 factor: 4046.86 },
          hectare:{ label: 'Hectare (ha)',        factor: 10000 },
        }
      }
    };

    let currentCat = 'length';

    // Tab styling
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCat = btn.dataset.cat;
        populateSelects();
        hideResult('result-box');
      });
    });

    function populateSelects() {
      const cat = UNITS[currentCat];
      const fromSel = document.getElementById('from-unit');
      const toSel   = document.getElementById('to-unit');
      const keys    = Object.keys(cat.units);

      fromSel.innerHTML = keys.map(k => `<option value="${k}">${cat.units[k].label}</option>`).join('');
      toSel.innerHTML   = keys.map(k => `<option value="${k}">${cat.units[k].label}</option>`).join('');
      toSel.selectedIndex = 1;
    }

    function convertTemperature(value, from, to) {
      let celsius;
      if (from === 'celsius')    celsius = value;
      if (from === 'fahrenheit') celsius = (value - 32) * 5/9;
      if (from === 'kelvin')     celsius = value - 273.15;
      if (to === 'celsius')    return celsius;
      if (to === 'fahrenheit') return celsius * 9/5 + 32;
      if (to === 'kelvin')     return celsius + 273.15;
    }

    function convert() {
      const val  = parseFloat(document.getElementById('input-value').value);
      const from = document.getElementById('from-unit').value;
      const to   = document.getElementById('to-unit').value;

      if (isNaN(val)) { alert('Please enter a valid number.'); return; }

      let result;
      const cat = UNITS[currentCat];

      if (currentCat === 'temperature') {
        result = convertTemperature(val, from, to);
      } else {
        const inBase = val * cat.units[from].factor;
        result = inBase / cat.units[to].factor;
      }

      const fromLabel = cat.units[from].label;
      const toLabel   = cat.units[to].label;
      const box = document.getElementById('result-box');
      box.classList.add('show');
      document.getElementById('result-value').textContent =
        formatNumber(result) + ' ' + toLabel.split('(')[0].trim();
      document.getElementById('result-formula').textContent =
        `${formatNumber(val)} ${fromLabel} = ${formatNumber(result)} ${toLabel}`;
    }

    function swapUnits() {
      const fromSel = document.getElementById('from-unit');
      const toSel   = document.getElementById('to-unit');
      const tmp = fromSel.value;
      fromSel.value = toSel.value;
      toSel.value = tmp;
      hideResult('result-box');
    }

    function resetForm() {
      document.getElementById('input-value').value = '';
      hideResult('result-box');
    }

    // Init
    populateSelects();
  </script>

  <style>
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-btn {
      padding: 7px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .tab-btn:hover  { background: var(--bg); color: var(--text); }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  </style>
</body>
</html>
